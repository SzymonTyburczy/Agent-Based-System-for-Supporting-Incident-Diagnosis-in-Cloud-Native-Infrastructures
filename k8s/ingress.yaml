# Ingress — the public entry point: the panel and the three APIs it calls.
#
# TEMPLATE. Every idar.example.com below is a placeholder for your domain: four
# names (or one wildcard DNS record), replaced in one go with
#
#   sed -i 's/idar\.example\.com/idar.your-domain.tld/g' k8s/ingress.yaml
#
# Unchanged, it routes nothing: no DNS points these names at your cluster, so
# `kubectl apply -f k8s/` can include it safely.
#
# One host per service rather than one host with /api, /converter and /rag
# prefixes: the panel calls each API at the root of its base URL and the APIs
# serve their routes at the root, so prefixes would need rewrite rules, which are
# different for every controller (docs/CLUSTER.md, "Networking and public URLs").
# Separate hosts need no rewrites and work with any controller.
#
# Only the paths the panel calls are routed. Everything else stays inside the
# cluster: /alerts/webhook (Alertmanager calls the agent Service directly),
# /api/search (the agent calls rag-server directly), document deletion, /docs,
# /openapi.json. When the panel starts calling a new endpoint, add its path here.
#
# Written for Traefik, the default controller in k3s. It needs no annotations
# here: by default it has no request body limit, no response timeout and streams
# Server-Sent Events as they come. With another controller, change
# ingressClassName and make sure that
#   - requests of at least 16 MB pass (PDF uploads go up to 15 MB; NGINX-based
#     controllers allow 1 MB by default);
#   - a response may take at least 180 s (a conversion or an ingest can take that
#     long; an AWS ALB closes idle connections after 60 s by default);
#   - /reports/stream is not buffered (the panel's live report feed).
# Do not install kubernetes/ingress-nginx on a new cluster: it was retired in
# March 2026 and no longer receives security fixes.
#
# Together with this file:
#   1. Build the panel with the public URLs (VITE_* are fixed at build time):
#        docker build \
#          --build-arg VITE_AGENT_API_URL=https://agent.idar.example.com \
#          --build-arg VITE_CONVERTER_URL=https://converter.idar.example.com \
#          --build-arg VITE_RAG_API_URL=https://rag.idar.example.com \
#          -t idar-client:<tag> ./client
#   2. Put the panel's origin, https://idar.example.com, in agent-core-config
#      (CLIENT_ALLOWED_ORIGINS), doc-converter-config (ALLOWED_ORIGINS) and
#      rag-server-config (IDAR_CORS_ORIGINS), then restart those Deployments.
#   3. Provide the certificate for the four names in Secret idar-tls: from
#      cert-manager (uncomment the annotation below) or by hand with
#        kubectl create secret tls idar-tls -n idar --cert=tls.crt --key=tls.key
#      Redirecting HTTP to HTTPS is set in the controller's configuration.
#   4. Point the four DNS names at the controller's public address.
#
# Security: the panel has no login, and a VITE_* token is readable by everyone
# who can load the panel, so tokens do not protect a public deployment. Anyone
# who reaches these hosts can read and resolve incident reports, add documents
# to the knowledge base the agent relies on, and start conversions (several GiB
# of RAM each). Until an authentication proxy sits in front, limit who can reach
# the controller: an EC2 security group open only to the team's addresses, or a VPN.
#
# Apply after 00-namespace.yaml:  kubectl apply -f k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idar
  namespace: idar
  labels:
    app.kubernetes.io/name: idar-ingress
    app.kubernetes.io/part-of: idar
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt  # the name of your ClusterIssuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - idar.example.com
        - agent.idar.example.com
        - converter.idar.example.com
        - rag.idar.example.com
      secretName: idar-tls
  rules:
    - host: idar.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idar-client
                port:
                  number: 8080
    - host: agent.idar.example.com
      http:
        paths:
          # GET /reports, GET and PATCH /reports/{id}, GET /reports/stream.
          - path: /reports
            pathType: Prefix
            backend:
              service:
                name: agent-core
                port:
                  number: 8080
    - host: converter.idar.example.com
      http:
        paths:
          - path: /convert
            pathType: Exact
            backend:
              service:
                name: doc-converter
                port:
                  number: 5001
          # The panel shows the converter's status from this endpoint.
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: doc-converter
                port:
                  number: 5001
    - host: rag.idar.example.com
      http:
        paths:
          # POST /api/documents: Send in the Documentation view.
          - path: /api/documents
            pathType: Exact
            backend:
              service:
                name: rag-server
                port:
                  number: 8080
