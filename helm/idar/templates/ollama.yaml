{{- /*
ollama — embedding engine for the RAG knowledge base (k8s/ollama.yaml).
The init container pulls every model before the server starts; with no
network on a later restart, a model already on the volume is accepted.
*/ -}}
{{- if .Values.ollama.enabled }}
{{- $v := .Values.ollama }}
{{- $meta := dict "ctx" $ "name" "ollama" "component" "embedding-engine" }}
{{- $image := include "idar.image" (dict "ctx" $ "image" $v.image) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idar.labels" (dict "ctx" $ "name" "ollama") | nindent 4 }}
data:
  {{- include "idar.ollama.configData" . | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idar.labels" (dict "ctx" $ "name" "ollama") | nindent 4 }}
  {{- if $v.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "idar.storageClassName" (dict "ctx" $ "persistence" $v.persistence) | nindent 2 }}
  resources:
    requests:
      storage: {{ $v.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idar.labels" $meta | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "idar.selectorLabels" $meta | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idar.labels" $meta | nindent 4 }}
spec:
  replicas: 1
  # ReadWriteOnce volume: the old Pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "idar.selectorLabels" $meta | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idar.podLabels" $meta | nindent 8 }}
      annotations:
        # A changed model list or keep-alive rolls the Pod.
        checksum/config: {{ include "idar.ollama.configData" . | sha256sum }}
    spec:
      {{- include "idar.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      {{- include "idar.scheduling" $v | nindent 6 }}
      initContainers:
        - name: pull-models
          image: {{ $image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              server=$!
              for i in $(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 1; done
              for model in $OLLAMA_PULL_MODELS; do
                echo "pulling $model"
                ollama pull "$model" || ollama show "$model" >/dev/null 2>&1 || exit 1
              done
              kill "$server"
          env:
            - name: OLLAMA_PULL_MODELS
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_PULL_MODELS
            - name: OLLAMA_HOST
              value: 127.0.0.1:11434
            - name: OLLAMA_MODELS
              value: /models
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml $v.pullModelsResources | nindent 12 }}
          securityContext:
            {{- include "idar.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ollama
          image: {{ $image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /models
            - name: HOME
              value: /tmp
            - name: OLLAMA_KEEP_ALIVE
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_KEEP_ALIVE
          ports:
            - name: http
              containerPort: 11434
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            {{- toYaml $v.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            {{- toYaml $v.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            {{- toYaml $v.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "idar.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        - name: tmp
          emptyDir: {}
{{- if .Values.networkPolicies.enabled }}
---
# Ollama has no authentication. rag-server needs it for embeddings; agent-core
# only with LLM_PROVIDER=ollama.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idar.labels" (dict "ctx" $ "name" "ollama") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "idar.selectorLabels" $meta | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-core
      ports:
        - port: 11434
{{- end }}
{{- end }}

{{- define "idar.ollama.configData" -}}
# Space-separated; derived from ragServer.embeddingModel, agentCore.env and
# ollama.extraModels.
OLLAMA_PULL_MODELS: {{ include "idar.ollama.models" . | quote }}
OLLAMA_KEEP_ALIVE: {{ .Values.ollama.keepAlive | toString | quote }}
{{- end }}
