{{- /*
Ingress in front of the panel only: its Nginx proxies /api/agent,
/api/converter and /api/rag to the services, so the browser stays on one
origin. The Alertmanager webhook is not exposed (client/nginx.conf answers 404
on /api/agent/alerts/); Alertmanager calls agent-core's Service in-cluster.
*/ -}}
{{- if and .Values.ingress.enabled .Values.client.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idar
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idar.labels" (dict "ctx" $ "name" "idar-client" "component" "web-panel") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    # An empty host matches every host name and bare IP addresses.
    - {{ if . }}host: {{ . | quote }}
      {{ end -}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idar-client
                port:
                  name: http
    {{- end }}
{{- end }}
