# Overlay: Ollama in a container instead of on the host (Linux/EC2, or when you
# do not want to install Ollama). The one-off ollama-pull service pulls the
# model, and the API starts only after it succeeds.
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d --build
services:
  ollama:
    image: ollama/ollama:0.34.2
    volumes:
      - ollama_models:/root/.ollama
    # The port is not published on purpose (it would clash with Ollama on the
    # host); CLI:
    #   docker compose exec ollama ollama list
    # NVIDIA GPU (Docker Desktop: WSL2 + the NVIDIA driver; Linux: NVIDIA
    # Container Toolkit). Without a GPU 0.6b runs on the CPU; 8b is much slower.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.34.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    # The model the API uses (IDAR_EMBEDDING_MODEL from .env, or the default).
    command: ["${IDAR_EMBEDDING_MODEL:-qwen3-embedding:0.6b}"]
    restart: "no"

  server:
    environment:
      IDAR_OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
