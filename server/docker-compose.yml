# Development:  docker compose up -d qdrant        (API from `uv run fastapi dev`, Ollama on the host)
# Container:    docker compose up -d --build        (Qdrant + API in Docker, Ollama on the host)
# Everything:   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d --build
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The Qdrant image has no curl or wget; opening the TCP port from bash is enough.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  server:
    build: .
    image: idar-rag-server:local
    ports:
      - "8100:8080"
    env_file:
      # A local .env (model, chunking, token...) is optional; the service addresses
      # below override it anyway, because `localhost` in a container is the container.
      - path: .env
        required: false
    environment:
      IDAR_QDRANT_URL: http://qdrant:6333
      # Ollama on the host (Docker Desktop: host.docker.internal works out of the
      # box, GPU with no setup). Ollama in a container: docker-compose.ollama.yml.
      IDAR_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      # Linux has no host.docker.internal; host-gateway adds it to /etc/hosts.
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
