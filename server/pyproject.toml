[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    # Pinned: Smart App Control can block the cygrpc DLL of a fresh grpcio
    # release ("An Application Control policy has blocked this file") until the
    # wheel builds a reputation; 1.71.0 has one and passes.
    "grpcio==1.71.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
]

[tool.uv]
# uv-managed CPython only. Python from the Microsoft Store (App Execution Alias)
# runs in an MSIX container whose application control policy blocks unsigned
# native DLLs (grpc/cygrpc): "DLL load failed" when importing qdrant_client.
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow and not integration'"
markers = [
    "slow: tests with the real embedding model (need a running Ollama)",
    "integration: tests against Qdrant from docker compose",
]
