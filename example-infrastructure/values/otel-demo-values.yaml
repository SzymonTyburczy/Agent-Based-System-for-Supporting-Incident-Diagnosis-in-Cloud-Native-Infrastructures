components:
  # --- Core services & traffic generators ---
  frontend-proxy:
    replicas: 1     # Nginx routing incoming traffic
  frontend:
    replicas: 2     # Main store web interface written in Next.js
  load-generator:
    replicas: 1     # Automated store interaction script (generates traffic, metrics, and logs)
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 1Gi
  flagd:
    replicas: 1     # Feature flags & synthetic fault injection control panel

  # --- Core e-commerce microservices ---
  ad:
    replicas: 1     # Advertisement service (Java)
  cart:
    replicas: 1     # Shopping cart service (.NET)
  checkout:
    replicas: 2     # Order checkout service (Go)
  currency:
    replicas: 1     # Currency conversion service (C++)
  email:
    replicas: 1     # Confirmation email service (Ruby)
  payment:
    replicas: 1     # Payment processing service (Node.js)
  product-catalog:
    replicas: 1     # Product catalog & search service (Go)
  quote:
    replicas: 1     # Shipping quote calculator (PHP)
    resources:
      limits:
        memory: 100Mi
  recommendation:
    replicas: 1     # Product recommendations service (Python)
    resources:
      limits:
        memory: 120Mi
  shipping:
    replicas: 1     # Shipping dispatch service (Rust)
  accounting:
    replicas: 1     # Accounting & order ledger (Kafka/Go)
  image-provider:
    replicas: 1     # Product image server
    resources:
      limits:
        memory: 100Mi
  kafka:
    resources:
      limits:
        memory: 650Mi
  fraud-detection:
    resources:
      limits:
        memory: 350Mi

# =========================================================
# OBSERVABILITY CONFIGURATION (External LGTM stack)
# =========================================================

# Disable bundled developer tools
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

# Configure OpenTelemetry Collector to forward telemetry to external observability stack
opentelemetry-collector:
  mode: deployment
  resources:
    requests:
      memory: 100Mi
    limits:
      memory: 1Gi
  presets:
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
  config:
    connectors:
      spanmetrics: {}
    exporters:
      otlp/tempo:
        endpoint: "tempo.observability.svc.cluster.local:4317"
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: "http://loki.observability.svc.cluster.local:3100/otlp"
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: "http://prom-stack-kube-prometheus-prometheus.observability.svc.cluster.local:9090/api/v1/write"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [batch]
          exporters: [prometheusremotewrite]
  serviceMonitor:
    enabled: true