# =========================================================
# KUBE-PROMETHEUS-STACK VALUES (Grafana + Prometheus)
# =========================================================

grafana:
  adminPassword: "admin"
  sidecar:
    datasources:
      defaultDatasourceEnabled: false
  # Automatically provision Loki, Tempo and configure Prometheus to manage alerts
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prom-stack-kube-prometheus-prometheus.observability:9090/
      access: proxy
      isDefault: true
      jsonData:
        manageAlerts: true
        httpMethod: POST
        timeInterval: 30s
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
    - name: Tempo
      type: tempo
      url: http://tempo.observability.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToLogs:
          datasourceUid: 'Loki'

prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 2d

alertmanager:
  alertmanagerSpec:
    replicas: 1
    # See "Networking" in agent-core/README.md — required to make
    # host.docker.internal resolve inside the Alertmanager pod on Docker
    # Desktop.
    hostAliases:
      - ip: 192.168.65.254
        hostnames:
          - "host.docker.internal"
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: agent-webhook
      group_by: ['namespace', 'alertname', 'job']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        # CRITICAL: kube-prometheus-stack's default alertmanager config
        # routes the always-firing "Watchdog" heartbeat alert (and
        # "InfoInhibitor") to a null receiver — setting alertmanager.config
        # at all REPLACES that default wholesale, not merges with it. Omit
        # this and the webhook gets a "firing" call for Watchdog forever,
        # roughly every group_interval, for an alert that means nothing is
        # wrong.
        - receiver: "null"
          matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
        # New thesis-demo alerts (custom-thesis-alerts.yaml) — explicit for
        # documentation purposes; they'd hit agent-webhook via the default
        # receiver anyway, but this makes the intent visible in the file.
        - receiver: agent-webhook
          matchers:
            - alertname =~ "AdServiceHighCpu|CheckoutServiceErrors|KafkaConsumerFrozen"
    receivers:
      - name: "null"
      - name: agent-webhook
        webhook_configs:
          - url: http://host.docker.internal:8090/alerts/webhook
            send_resolved: true
            http_config:
              authorization:
                credentials: a_12345!

# Disable node-exporter on Docker Desktop Windows to avoid root mount permission issues
nodeExporter:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false