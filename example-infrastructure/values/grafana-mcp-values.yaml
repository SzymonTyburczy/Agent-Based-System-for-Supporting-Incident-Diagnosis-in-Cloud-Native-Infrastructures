# =========================================================
# GRAFANA MCP SERVER VALUES (Read-Only AI Agent Context)
# =========================================================

# Connect to our internal Grafana cluster service
grafana:
  url: "http://prom-stack-grafana.observability.svc.cluster.local:80"

# Enforce read-only mode so AI assistants cannot mutate dashboards or alerts
disableWrite: true

# mcp-grafana checks the Host header and answers 403 to anything not listed.
# agent-core deployed in the cluster (k8s/agent-core.yaml, namespace idar)
# reaches the server by its Service DNS name, so those names must be allowed.
# grafana-mcp-local-values.yaml replaces this list for Docker Desktop and has
# to repeat these entries.
extraArgs:
  - --allowed-hosts=grafana-mcp.observability.svc.cluster.local:8000,grafana-mcp.observability.svc:8000,grafana-mcp.observability:8000

# Basic auth credentials for local development cluster
env:
  GRAFANA_USERNAME: "admin"
  GRAFANA_PASSWORD: "admin"

# Expose service on port 8000 for SSE transport port forwarding
service:
  enabled: true
  type: ClusterIP
  port: 8000

# Lightweight resource limits for local Docker Desktop cluster
resources:
  limits:
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 30Mi
